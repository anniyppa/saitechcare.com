<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f8ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="100" rx="15" fill="url(#bgGradient)"/>
  
  <!-- Circuit pattern -->
  <g stroke="#ffffff" stroke-width="1" fill="none" opacity="0.2">
    <path d="M20,20 L40,20 L40,40 L60,40"/>
    <path d="M260,80 L280,80 L280,60 L260,60"/>
    <circle cx="40" cy="20" r="2" fill="#ffffff"/>
    <circle cx="40" cy="40" r="2" fill="#ffffff"/>
    <circle cx="280" cy="80" r="2" fill="#ffffff"/>
    <circle cx="280" cy="60" r="2" fill="#ffffff"/>
  </g>
  
  <!-- Main icon -->
  <g transform="translate(25, 25)">
    <rect width="50" height="50" rx="8" fill="#ffffff" opacity="0.9"/>
    <g transform="translate(12.5, 12.5)" fill="url(#bgGradient)">
      <!-- Microchip design -->
      <rect width="25" height="25" rx="3" fill="url(#bgGradient)"/>
      <rect x="3" y="3" width="19" height="19" rx="2" fill="#ffffff"/>
      <rect x="6" y="6" width="13" height="13" rx="1" fill="url(#bgGradient)"/>
      <!-- Connection pins -->
      <rect x="-2" y="8" width="4" height="2" fill="url(#bgGradient)"/>
      <rect x="-2" y="15" width="4" height="2" fill="url(#bgGradient)"/>
      <rect x="23" y="8" width="4" height="2" fill="url(#bgGradient)"/>
      <rect x="23" y="15" width="4" height="2" fill="url(#bgGradient)"/>
      <rect x="8" y="-2" width="2" height="4" fill="url(#bgGradient)"/>
      <rect x="15" y="-2" width="2" height="4" fill="url(#bgGradient)"/>
      <rect x="8" y="23" width="2" height="4" fill="url(#bgGradient)"/>
      <rect x="15" y="23" width="2" height="4" fill="url(#bgGradient)"/>
    </g>
  </g>
  
  <!-- Company name -->
  <text x="90" y="35" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="url(#textGradient)">SAI TECH CARE</text>
  <text x="90" y="55" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#ffffff" opacity="0.8">Professional Tech Services</text>
  <text x="90" y="70" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="400" fill="#ffffff" opacity="0.8">Bangalore • Since 2014</text>
</svg>