<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#iconGradient)"/>
  
  <!-- Microchip icon -->
  <g transform="translate(20, 20)" fill="#ffffff">
    <rect width="24" height="24" rx="3" fill="#ffffff"/>
    <rect x="3" y="3" width="18" height="18" rx="2" fill="url(#iconGradient)"/>
    <rect x="6" y="6" width="12" height="12" rx="1" fill="#ffffff"/>
    <rect x="8" y="8" width="8" height="8" rx="1" fill="url(#iconGradient)"/>
    
    <!-- Connection pins -->
    <rect x="-2" y="8" width="4" height="2" fill="#ffffff"/>
    <rect x="-2" y="14" width="4" height="2" fill="#ffffff"/>
    <rect x="22" y="8" width="4" height="2" fill="#ffffff"/>
    <rect x="22" y="14" width="4" height="2" fill="#ffffff"/>
    <rect x="8" y="-2" width="2" height="4" fill="#ffffff"/>
    <rect x="14" y="-2" width="2" height="4" fill="#ffffff"/>
    <rect x="8" y="22" width="2" height="4" fill="#ffffff"/>
    <rect x="14" y="22" width="2" height="4" fill="#ffffff"/>
  </g>
  
  <!-- Letter S overlay -->
  <text x="32" y="42" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#ffffff" opacity="0.9">S</text>
</svg>